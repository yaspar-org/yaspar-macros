name: Build
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned by SHA, so the ref no longer names the toolchain: pass it explicitly.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo check
        run: cargo check --workspace --all-targets

      # Every `.rs` file must open with Amazon's two-line SPDX header. Called with no
      # argument it walks the whole repository, so a file added in a new directory is
      # covered without editing this step. The `tests/ui` fixtures are included too:
      # their `.stderr` snapshots were regenerated to absorb the two extra lines.
      - name: Run copyright check
        run: ./.github/copyright-check.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Keeps `rust-version` in both manifests honest. Lib targets only: the
      # dev-dependencies are free to need something newer than consumers do.
      - name: Install the declared MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo check
        run: cargo check --workspace

  miri:
    name: Miri (${{ matrix.model }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: stacked borrows
            miriflags: -Zmiri-strict-provenance
          - model: tree borrows
            miriflags: -Zmiri-tree-borrows -Zmiri-strict-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pinned deliberately: Miri tracks the compiler's aliasing model, so a floating
      # nightly would let this job's verdict change without a commit. Bump on purpose.
      NIGHTLY: nightly-2026-08-25
      MIRIFLAGS: ${{ matrix.miriflags }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned nightly with Miri
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: miri, rust-src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `rust-cache` does not cover Miri's sysroot, which lives outside the target
      # directory and is rebuilt from source by `cargo miri setup`. It is keyed on the
      # pinned nightly, since a sysroot belongs to exactly one toolchain.
      - name: Cache the Miri sysroot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/miri
          key: ${{ runner.os }}-miri-sysroot-${{ env.NIGHTLY }}

      - run: cargo miri setup

      # The two opt-in options put raw pointers where the original had references, so
      # these three suites are the only control over the aliasing model. The depth-only
      # tests are skipped: they are about frames rather than aliasing, and Miri would
      # take forever over them. Kept in step with the invocations in the README.
      - name: Aliasing tests
        run: |
          cargo miri test --test context -- --skip deep_ --skip _is_flat --skip _is_stack_safe
          cargo miri test --test transform -- lends_the_callee two_values_of three_lent_values_with
          cargo miri test --test group -- lend unsafe_options --skip _is_flat

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Advisories, licences, duplicate versions and registry provenance, per deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  test:
    name: Test Suite
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        rust: [ stable ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Includes the `trybuild` UI suite, which pins the rejection messages of both
      # macros against the `tests/ui/*.stderr` snapshots.
      - name: Run tests
        run: cargo test --workspace --all-features

  lints:
    name: Lints
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Run rustdoc lints
        run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: ""

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
