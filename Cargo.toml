[workspace]
members = ["defs"]

[package]
name = "yaspar-macros"
version = "0.1.1"
edition = "2024"
# A floor, not a pin: `edition = "2024"` needs 1.85 and the let-chains in `emit.rs` and
# `context.rs` need 1.88. Any newer toolchain is fine. Checked by the `msrv` CI job.
rust-version = "1.88"
readme = "README.md"
license = "Apache-2.0"
description = "Proc macros: `#[stack_safe]` rewrites recursive functions — a cycle of them at a time — into a heap-stack state machine; `#[delegate_trait]` forwards unwritten trait methods to an inner field."
authors = ["the Amazon Trusted Solver team"]
keywords = ["macros", "recursion", "stack", "delegation"]
categories = ["development-tools::procedural-macro-helpers", "rust-patterns"]
homepage = "https://github.com/yaspar-org/yaspar-macros"
repository = "https://github.com/yaspar-org/yaspar-macros"
# `Config` is an internal Brazil package definition and has no business in a published
# crate. It is not in the repository either; this keeps it out of the package even if a
# local workspace tool puts one back.
exclude = ["Config"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "visit", "visit-mut", "extra-traits"] }

# The expansions of `#[stack_safe]` refer to the definitions crate, so anything using
# these macros depends on it too. It is only needed to *run* the expansions, hence a
# dev-dependency here for this crate's own tests and examples.
[dev-dependencies]
yaspar-macros-defs = { path = "defs", version = "0.1.0" }
# The rejections are the half of the feature that is easiest to break silently: a
# `compile_fail` doctest keeps passing however the message reads. These pin the messages.
trybuild = "1.0"
